<!DOCTYPE html>
<html>
<head>
<title>Scrapwright Animation Preview</title>
<style>
body { background: #1a1a2e; color: #eee; font-family: monospace; text-align: center; margin: 20px; }
h1 { color: #f0c040; }
h2 { color: #90c0f0; margin-top: 30px; }
.anim-row { display: flex; justify-content: center; gap: 40px; flex-wrap: wrap; margin: 20px 0; }
.anim-box { text-align: center; }
.anim-box canvas { border: 2px solid #333; border-radius: 8px; background: #111; image-rendering: pixelated; }
.anim-box label { display: block; margin-top: 6px; color: #aaa; font-size: 12px; }
.rotations { display: flex; justify-content: center; gap: 10px; flex-wrap: wrap; margin: 10px 0; }
.rotations img { width: 96px; height: 96px; image-rendering: pixelated; border: 1px solid #333; border-radius: 4px; background: #111; }
.rotations .rot-label { font-size: 10px; color: #888; }
.speed-control { margin: 10px 0; }
</style>
</head>
<body>
<h1>🐕 Scrapwright — Animation Preview</h1>

<h2>Static Rotations</h2>
<div class="rotations" id="rotations"></div>

<div class="speed-control">
  <label>Speed: <input type="range" id="speed" min="2" max="20" value="8"> <span id="fps">8</span> FPS</label>
</div>

<h2>Walk (8 frames)</h2>
<div class="anim-row" id="walk-row"></div>

<h2>Run (6 frames)</h2>
<div class="anim-row" id="run-row"></div>

<h2>Bark (6 frames)</h2>
<div class="anim-row" id="bark-row"></div>

<script>
const dirs = ['south','south-east','east','north-east','north','north-west','west','south-west'];
const SIZE = 128;
let fps = 8;

// Rotations
const rotDiv = document.getElementById('rotations');
dirs.forEach(d => {
  const wrap = document.createElement('div');
  wrap.style.textAlign = 'center';
  const img = document.createElement('img');
  img.src = `rotations/${d}.png`;
  const lbl = document.createElement('div');
  lbl.className = 'rot-label';
  lbl.textContent = d;
  wrap.appendChild(img);
  wrap.appendChild(lbl);
  rotDiv.appendChild(wrap);
});

// Animation player
function createAnimPlayer(containerId, animName, frameCount) {
  const container = document.getElementById(containerId);
  dirs.forEach(dir => {
    const box = document.createElement('div');
    box.className = 'anim-box';
    const canvas = document.createElement('canvas');
    canvas.width = SIZE;
    canvas.height = SIZE;
    const ctx = canvas.getContext('2d');
    ctx.imageSmoothingEnabled = false;
    const label = document.createElement('label');
    label.textContent = dir;
    box.appendChild(canvas);
    box.appendChild(label);
    container.appendChild(box);

    const frames = [];
    let loaded = 0;
    for (let i = 0; i < frameCount; i++) {
      const img = new Image();
      img.src = `animations/${animName}/${dir}/frame_${String(i).padStart(3,'0')}.png`;
      img.onload = () => { loaded++; };
      frames.push(img);
    }

    let frame = 0;
    let lastTime = 0;
    function animate(time) {
      if (time - lastTime > 1000 / fps) {
        lastTime = time;
        ctx.clearRect(0, 0, SIZE, SIZE);
        if (frames[frame] && frames[frame].complete) {
          ctx.drawImage(frames[frame], 0, 0, SIZE, SIZE);
        }
        frame = (frame + 1) % frameCount;
      }
      requestAnimationFrame(animate);
    }
    requestAnimationFrame(animate);
  });
}

createAnimPlayer('walk-row', 'walk-8-frames', 8);
createAnimPlayer('run-row', 'running-6-frames', 6);
createAnimPlayer('bark-row', 'bark', 6);

// Speed control
const slider = document.getElementById('speed');
const fpsLabel = document.getElementById('fps');
slider.addEventListener('input', () => {
  fps = parseInt(slider.value);
  fpsLabel.textContent = fps;
});
</script>
</body>
</html>
